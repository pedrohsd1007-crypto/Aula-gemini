<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Vaga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Verificador de Elegibilidade</h2>
        <p class="subtitle">Insira seus dados para verificar se você está apto para a vaga.</p>
        
        <form id="vagaForm">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="idade">Idade (anos)</label>
                <input type="number" id="idade" min="0" placeholder="Ex: 25" required>
            </div>

            <div class="input-group">
                <label for="altura">Altura (metros)</label>
                <input type="number" id="altura" step="0.01" min="0" placeholder="Ex: 1.75" required>
            </div>

            <button type="submit">Verificar Vaga</button>
        </form>

        <div id="resultado" class="resultado hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
